name: Build and Release Steve API

on: 
  push:
    tags:
      - v*

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps: 
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
    
    - name: Build Steve API
      # Parallel make doesn't seem to actually make this faster, even if we do
      # `go mod download` ahead of time.
      run: make release/steve.sha512sum
    
    - name: Upload Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: |
          release/*.tar.gz
          release/*.sha512sum
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download built assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ./release
        merge-multiple: true
    - name: Create Release and Upload Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create a release using the tag
        gh release create --repo "${{ github.repository }}" \
          "${{ github.ref_name }}" --generate-notes
        # Upload all files in the release directory
        for asset in ./release/*; do
          gh release upload --repo "${{ github.repository }}" \
            "${{ github.ref_name }}" "$asset"
        done
